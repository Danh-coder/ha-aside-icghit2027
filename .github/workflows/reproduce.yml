name: CPU reproducibility
on: [push, pull_request, workflow_dispatch]
jobs:
  recorded-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/runtime.txt
      - run: python scripts/smoke_training.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare_evaluation.py
      - run: python scripts/reproduce_results.py
      - run: python scripts/plot_results.py
      - run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-tables-and-figures
          path: outputs/reproduced
